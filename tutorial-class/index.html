<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Galmuri11', monospace; -webkit-font-smoothing: none; }
  img { image-rendering: pixelated; }
  @keyframes sgn-wob { 0%,100% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
  @keyframes sgn-wobV { 0%,100% { transform: rotate(90deg) translateX(6px); } 50% { transform: rotate(90deg) translateX(-4px); } }
  @keyframes sgn-rotV { 0%,100% { transform: rotate(90deg) translateX(-5px); } 50% { transform: rotate(90deg) translateX(5px); } }
  @keyframes sgn-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes sgn-boxpulse { 0%,100% { background:rgba(255,45,38,.10); box-shadow:0 0 0 2px rgba(255,45,38,0) inset; } 50% { background:rgba(255,45,38,.42); box-shadow:0 0 0 2px rgba(255,255,255,.6) inset; } }
  @keyframes sgn-blink { 0%,60% { opacity:1; } 61%,100% { opacity:.25; } }
  @keyframes sgn-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes sgn-fadein { from { opacity: 0; } to { opacity: 1; } }
</style>
</helmet>
<div style="width:100%; min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; padding:0; background:#e9edf3;">

  <div style="{{ wrapStyle }}">

    <sc-if value="{{ closed }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%; aspect-ratio:1200/2000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:#dfe4ec; border:5px solid #3a2e5c; box-shadow:8px 8px 0 rgba(58,46,92,.3); padding:24px;">
        <div style="font-family:'Galmuri11',monospace; font-size:15px; color:#5a5470; letter-spacing:-.5px;">튜토리얼을 닫았습니다.</div>
        <div onClick="{{ onReopen }}" style="cursor:pointer; font-family:'Galmuri11',monospace; font-weight:700; font-size:15px; color:#fff; background:#6b70cf; padding:11px 20px; box-shadow:4px 4px 0 #3a2e5c;">다시 열기</div>
      </div>
    </sc-if>

    <sc-if value="{{ notClosed }}" hint-placeholder-val="{{ true }}">
    <div style="{{ stageStyle }}">

      <div style="{{ innerStyle }}">

      <div style="{{ bgLayerStyle }}"></div>
      <div style="{{ prevBgStyle }}"></div>

      <div style="{{ fxStyle }}" onClick="{{ onTap }}">

        <!-- (background lives in its own persistent layer above) -->

        <!-- S펜 overlay (STEP 6) -->
        <sc-if value="{{ hasPen }}" hint-placeholder-val="{{ false }}">
          <div style="{{ penStyle }}; position:absolute; image-rendering:auto; pointer-events:none; filter:drop-shadow(3px 6px 5px rgba(58,46,92,.35));"></div>
        </sc-if>

        <!-- inset images (STEP 8d popovers, STEP 17 dialog) — each fades in, staggered -->
        <sc-for list="{{ insetsR }}" as="ins" hint-placeholder-count="1">
          <div style="{{ ins.style }}; pointer-events:none;"></div>
        </sc-for>

        <!-- title screen -->
        <sc-if value="{{ isTitle }}" hint-placeholder-val="{{ true }}">
          <div style="position:absolute; inset:0; background:linear-gradient(180deg,#FCE3EC 0%,#F8CBDC 55%,#F2AEC7 100%); overflow:hidden;">
            <div style="position:absolute; top:8%; left:12%; width:16px; height:16px; background:#fff; opacity:.7;"></div>
            <div style="position:absolute; top:14%; left:78%; width:22px; height:22px; background:#fff; opacity:.6;"></div>
            <div style="position:absolute; top:22%; left:22%; width:12px; height:12px; background:#fff; opacity:.5;"></div>
            <div style="position:absolute; top:30%; left:66%; width:14px; height:14px; background:#fff; opacity:.5;"></div>
            <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8% 8% 12%;">
              <div style="font-family:'Galmuri11',monospace; font-weight:700; font-size:clamp(13px,4.9cqw,20px); color:#fff; background:#6b70cf; padding:6px 14px; letter-spacing:-.5px; box-shadow:4px 4px 0 #3a2e5c; margin-bottom:6%;">스마트구몬N</div>
              <div style="font-family:'Galmuri14',monospace; font-weight:700; font-size:clamp(26px,10.7cqw,44px); line-height:1.25; color:#A3134A; text-align:center; letter-spacing:-1px; text-shadow:3px 3px 0 rgba(255,255,255,.85);">화상수업<br>튜토리얼</div>
              <div style="position:relative; width:88%; max-width:320px; margin-top:6%;">
                <div style="background:#3a2e5c; padding:4px; box-shadow:5px 5px 0 rgba(58,46,92,.25); clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);">
                  <div style="background:#fff; padding:12px 14px; clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);">
                    <div style="font-family:'Galmuri11',monospace; font-size:clamp(12px,3.9cqw,16px); line-height:1.55; color:#A3134A; letter-spacing:-.5px; text-align:center; word-break:keep-all;">화상수업 첫 입장방법,<br>함께 살펴볼까요?</div>
                  </div>
                </div>
                <div style="position:absolute; bottom:-10px; left:50%; margin-left:-8px; width:15px; height:15px; background:#fff; border-right:4px solid #3a2e5c; border-bottom:4px solid #3a2e5c; transform:rotate(45deg);"></div>
              </div>
              <div style="{{ charFullStyle }}; width:40%; max-width:175px; margin-top:5%; aspect-ratio:572/796; background-size:contain; background-repeat:no-repeat; background-position:center; image-rendering:pixelated; animation:sgn-float 2.4s ease-in-out infinite; filter:drop-shadow(0 8px 0 rgba(58,46,92,.12));"></div>
              <div style="margin-top:5%; font-family:'Galmuri11',monospace; font-weight:700; font-size:clamp(13px,4.4cqw,18px); color:#fff; background:#ef4b45; padding:8px 18px; letter-spacing:-.5px; box-shadow:4px 4px 0 #a8271f; animation:sgn-blink 1.2s steps(1) infinite;">화면을 터치하세요</div>
            </div>
          </div>
        </sc-if>

        <!-- pen-choice screen -->
        <sc-if value="{{ isPen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute; inset:0; background:linear-gradient(180deg,#d5ecfb 0%,#bfe0fa 60%,#a9cef2 100%); display:flex; flex-direction:column; align-items:center; padding:11% 7% 10%;">
            <div style="font-family:'Galmuri11',monospace; font-weight:700; font-size:clamp(15px,5.4cqw,22px); color:#fff; background:#6b70cf; padding:9px 18px; letter-spacing:-.5px; box-shadow:5px 5px 0 #3a2e5c;">사용하는 펜을 골라주세요.</div>
            <div style="margin-top:9px; font-family:'Galmuri11',monospace; font-size:clamp(10px,3.2cqw,13px); color:#4a4560; letter-spacing:-.5px;">※ 페이퍼플러스는 해당 X</div>
            <div style="flex:1; width:100%; display:flex; flex-direction:column; gap:5%; margin-top:7%;">
              <div onClick="{{ onAndroid }}" style="{{ penAStyle }}; flex:1; cursor:pointer; background:#3a2e5c; padding:5px; box-shadow:6px 6px 0 rgba(58,46,92,.3);">
                <div style="width:100%; height:100%; background:#dff3e4; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border:4px solid #2f8f56;">
                  <div style="font-family:'Galmuri14',monospace; font-weight:700; font-size:clamp(24px,9.8cqw,40px); color:#237a45; letter-spacing:-1px;">S펜</div>
                  <div style="font-family:'Galmuri11',monospace; font-size:clamp(12px,3.9cqw,16px); color:#3a2e5c; letter-spacing:-.5px;">안드로이드</div>
                </div>
              </div>
              <div onClick="{{ onApple }}" style="{{ penIStyle }}; flex:1; cursor:pointer; background:#3a2e5c; padding:5px; box-shadow:6px 6px 0 rgba(58,46,92,.3);">
                <div style="width:100%; height:100%; background:#e6ecfb; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border:4px solid #5866c4;">
                  <div style="font-family:'Galmuri14',monospace; font-weight:700; font-size:clamp(24px,9.8cqw,40px); color:#3d4aa8; letter-spacing:-1px;">애플펜슬</div>
                  <div style="font-family:'Galmuri11',monospace; font-size:clamp(12px,3.9cqw,16px); color:#3a2e5c; letter-spacing:-.5px;">iOS</div>
                </div>
              </div>
            </div>
          </div>
        </sc-if>

        <!-- end screen -->
        <sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute; inset:0; background:linear-gradient(180deg,#FCE3EC 0%,#F8CBDC 55%,#F2AEC7 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:9%; overflow:hidden;">
            <div style="position:absolute; top:12%; left:16%; width:16px; height:16px; background:#fff; opacity:.6;"></div>
            <div style="position:absolute; top:20%; left:74%; width:20px; height:20px; background:#fff; opacity:.55;"></div>
            <div style="font-family:'Galmuri14',monospace; font-weight:700; font-size:clamp(24px,9.8cqw,40px); color:#A3134A; text-align:center; letter-spacing:-1px; text-shadow:3px 3px 0 rgba(255,255,255,.85);">튜토리얼 완료!</div>
            <div style="position:relative; width:80%; max-width:300px; margin-top:6%;">
              <div style="background:#3a2e5c; padding:4px; box-shadow:5px 5px 0 rgba(58,46,92,.25); clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);">
                <div style="background:#fff; padding:12px 14px; clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);">
                  <div style="font-family:'Galmuri11',monospace; font-weight:700; font-size:clamp(14px,4.4cqw,18px); line-height:1.5; color:#A3134A; letter-spacing:-.5px; text-align:center; word-break:keep-all;">이제 수업준비 완료!</div>
                </div>
              </div>
              <div style="position:absolute; bottom:-10px; left:50%; margin-left:-8px; width:15px; height:15px; background:#fff; border-right:4px solid #3a2e5c; border-bottom:4px solid #3a2e5c; transform:rotate(45deg);"></div>
            </div>
            <div style="{{ charFullStyle }}; width:42%; max-width:185px; margin:5% 0 6%; aspect-ratio:572/796; background-size:contain; background-repeat:no-repeat; background-position:center; image-rendering:pixelated; animation:sgn-float 2.4s ease-in-out infinite; filter:drop-shadow(0 8px 0 rgba(58,46,92,.12));"></div>
            <div style="display:flex; flex-direction:column; gap:12px; width:82%; max-width:280px;">
              <div onClick="{{ onRestart }}" style="cursor:pointer; text-align:center; font-family:'Galmuri11',monospace; font-weight:700; font-size:clamp(14px,4.15cqw,17px); color:#fff; background:#6b70cf; padding:13px; letter-spacing:-.5px; box-shadow:4px 4px 0 #3a2e5c;">처음으로 돌아가기</div>
            </div>
          </div>
        </sc-if>

        <!-- red guide boxes -->
        <sc-for list="{{ boxesR }}" as="b" hint-placeholder-count="1">
          <div style="{{ b.style }}; position:absolute; border:3px solid #ff3b30; animation:sgn-boxpulse 1.1s ease-in-out infinite; pointer-events:none;"></div>
        </sc-for>

        <!-- record dot (STEP 8): white → red -->
        <sc-if value="{{ hasRecord }}" hint-placeholder-val="{{ false }}">
          <div style="{{ recordDotStyle }}; position:absolute; border-radius:50%; pointer-events:none; transition:background .12s ease;"></div>
        </sc-if>

        <!-- hand cursors (auto centered on each box; wrapper scales on press, inner wobbles) -->
        <sc-for list="{{ fingers }}" as="f" hint-placeholder-count="1">
          <div style="{{ f.wrapStyle }}; position:absolute; pointer-events:none;">
            <div style="{{ f.innerStyle }}"></div>
          </div>
        </sc-for>

      </div>

      </div><!-- /inner -->

      <!-- character + speech bubble layer (NOT scaled on press; fades out with finger) -->
      <sc-if value="{{ showChar }}" hint-placeholder-val="{{ false }}">
        <div style="{{ charLayerStyle }}">
          <div style="{{ bubbleWrapStyle }}; position:absolute; display:flex; align-items:flex-start; gap:1.5cqw; pointer-events:none; animation:sgn-bob 2.6s ease-in-out infinite;">
            <div style="{{ charHeadStyle }}; width:23%; max-width:100px; flex:none; margin-top:8px; aspect-ratio:711/535; background-size:contain; background-repeat:no-repeat; background-position:center; image-rendering:pixelated; filter:drop-shadow(0 3px 0 rgba(58,46,92,.18));"></div>
            <div style="{{ bubbleBoxStyle }}">
              <div style="background:#3a2e5c; padding:1cqw; box-shadow:5px 5px 0 rgba(58,46,92,.3); clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);">
                <div style="background:#fef6da; padding:2.9cqw 3.4cqw; clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);">
                  <div style="font-family:'Galmuri11',monospace; font-size:3.9cqw; line-height:1.55; color:#3a2e5c; letter-spacing:-.6px; word-break:keep-all; white-space:pre-line;"><sc-for list="{{ bubbleRuns }}" as="rn" hint-placeholder-count="1"><span style="{{ rn.style }}">{{ rn.text }}</span></sc-for></div>
                </div>
              </div>
              <div style="position:absolute; left:-9px; top:16px; width:15px; height:15px; background:#fef6da; border-left:4px solid #3a2e5c; border-bottom:4px solid #3a2e5c; transform:rotate(45deg);"></div>
            </div>
          </div>
        </div>
      </sc-if>

      <!-- back button -->
      <sc-if value="{{ showBack }}" hint-placeholder-val="{{ true }}">
        <div onClick="{{ onBack }}" style="position:absolute; top:12px; left:12px; z-index:5; width:38px; height:38px; display:flex; align-items:center; justify-content:center; background:#fef6da; border:3px solid #3a2e5c; box-shadow:3px 3px 0 rgba(58,46,92,.4); cursor:pointer; font-family:'Galmuri11',monospace; font-weight:700; font-size:18px; color:#3a2e5c;">←</div>
      </sc-if>

      <!-- progress bar -->
      <sc-if value="{{ showProgress }}" hint-placeholder-val="{{ true }}">
        <div style="position:absolute; bottom:3cqw; left:50%; transform:translateX(-50%); z-index:5; display:flex; gap:1cqw; padding:2cqw; background:rgba(58,46,92,.55);">
          <sc-for list="{{ dots }}" as="d" hint-placeholder-count="19">
            <div onClick="{{ d.onClick }}" style="{{ d.style }}; width:2.2cqw; height:2.2cqw;"></div>
          </sc-for>
        </div>
      </sc-if>

      <!-- black fade overlay (restart) -->
      <div style="{{ fadeBlackStyle }}"></div>

    </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:760}}">
class Component extends DCLogic {
  state = { idx: 0, history: [], pressing: false, out: false, busy: false, pen: null, pressPen: null, recordOn: false, closed: false, loaded: {}, phase: 0, prevBg: null, prevShown: false, fadeBlack: false };

  BASE = 'assets/';

  get STEPS() {
    return [
      { id: 'title', type: 'title', aw: 1200, ah: 2000, next: 's1' },
      { id: 's1', type: 'screen', bg: 'class-01.jpg', aw: 1200, ah: 2000, dot: 1, pos: 'bottom',
        bubble: `회원앱에서 로그인을 한 후에,
메인화면에서 우측 상단의
[r]'三(삼선)' 표시[/r]를 눌러주세요.`,
        boxes: [{ l: 91.5, t: 1.9, w: 6.5, h: 3.4, r: '12px' }], fingerAnim: 'sgn-wobV', fingerAt: { l: 94.7, t: 6.8 }, fingerMargin: '2px 0 0 -14px', next: 's2' },
      { id: 's2', type: 'screen', bg: 'class-02.jpg', aw: 1200, ah: 2000, dot: 2, pos: 'top',
        bubble: `목록에서 [r]스마트클래스[/r]를
선택하고 들어갑니다.`,
        boxes: [{ l: 6, t: 52.8, w: 36, h: 5, r: '12px' }], fingerAt: { l: 44.5, t: 55.3 }, fingerMargin: '-10px 0 0 2px', next: 's3' },
      { id: 's3', type: 'screen', bg: 'class-03.jpg', aw: 1200, ah: 2000, dot: 3, pos: 'top',
        bubble: `선생님과의 수업 일정이 없으면,
[b]해당 요일 목록[/b]에 뜨지 않아요.`,
        boxes: [{ l: 1.5, t: 35, w: 97, h: 8.6, r: '18px' }], fingerAnim: 'sgn-wobV', fingerAt: { l: 50, t: 45.2 }, fingerMargin: '2px 0 0 -14px', next: 's3b' },
      { id: 's3b', type: 'screen', bg: 'class-03.jpg', aw: 1200, ah: 2000, dot: 4, pos: 'top',
        bubble: `제 수업은 [r]월요일 18시 50분[/r]이에요.
[r]월요일[/r]로 이동해 볼까요?`,
        boxes: [{ l: 22.5, t: 35.8, w: 9.5, h: 7.4, r: '12px' }], fingerAnim: 'sgn-wobV', fingerAt: { l: 27.2, t: 44.8 }, fingerMargin: '2px 0 0 -14px', next: 's4' },
      { id: 's4', type: 'screen', bg: 'class-04.jpg', aw: 1200, ah: 2000, dot: 5, pos: 'top', softFrom: true,
        bubble: `월요일로 이동하면,
[r]예정된 수업 일정[/r]이 나와있어요.
[b]입장은 5분 전[/b]부터 가능해요.`,
        boxes: [{ l: 72.5, t: 48.8, w: 25.5, h: 4.8, r: '12px' }], fingerAnim: 'sgn-wobV', fingerAt: { l: 85.2, t: 55.2 }, fingerMargin: '2px 0 0 -14px', next: 's5' },
      { id: 's5', type: 'screen', bg: 'class-05.jpg', aw: 1200, ah: 2000, dot: 6, pos: 'top', softFrom: true,
        bubble: `[b]수업 입장 5분 전[/b]이 되면,
[r]'입장' 버튼이 활성화[/r]돼요.`,
        boxes: [{ l: 76.5, t: 48.5, w: 19.5, h: 5.5, r: '12px' }], fingerAnim: 'sgn-wobV', fingerAt: { l: 86.2, t: 55.6 }, fingerMargin: '2px 0 0 -14px', next: 's6' },
      { id: 's6', type: 'screen', bg: 'class-06.jpg', aw: 1200, ah: 2000, dot: 7, pos: 'top', softFrom: true,
        bubble: `입장 버튼을 누르면
[r]입장 중으로 변경[/r]돼요.
기다리고 있으면,
[b]자동으로 수업에 입장[/b]됩니다.
[g](※ 계속 입장 중으로 뜬다면
선생님이 아직 들어오지 않은 상태이거나,
Wifi가 원활하지 않아서일 수 있어요.)[/g]`,
        boxes: [{ l: 76, t: 49.3, w: 20, h: 4.6, r: '12px' }], fingerAnim: 'sgn-wobV', fingerAt: { l: 86, t: 55.4 }, fingerMargin: '2px 0 0 -14px', next: 's7' },
      { id: 's7', type: 'screen', bg: 'class-07.jpg', aw: 1200, ah: 2000, dot: 8, pos: 'top', softFrom: true, fadeNext: true,
        bubble: `수업연결이 잘 되었다면,
[b]수업 대기로 상태가 변경[/b]돼요.
잠시 기다리고 있으면,
[r]선생님이 수업을 시작[/r]해주실 거에요.`,
        boxes: [{ l: 72.5, t: 48.8, w: 25.5, h: 4.8, r: '12px' }], fingerAnim: 'sgn-wobV', fingerAt: { l: 85.2, t: 55.2 }, fingerMargin: '2px 0 0 -14px', next: 's8' },
      { id: 's8', type: 'screen', bg: 'class-08.jpg', aw: 1200, ah: 2000, dot: 9, pos: 'top', fadeNext: true, noFinger: true,
        bubble: `[b]수업이 잘 연결[/b]되었어요.
선생님과 즐거운 수업 시작!`,
        boxes: [], next: 's9' },
      { id: 's9', type: 'screen', bg: 'class-09.jpg', aw: 1200, ah: 2000, dot: 10, pos: 'top',
        bubble: `수업이 끝나면,
[b]자동으로 종료[/b]돼요.
수업 완료로 변경되었다면,
[r]오늘의 수업 완료![/r]`,
        boxes: [{ l: 73.5, t: 48.8, w: 24.5, h: 4.8, r: '12px' }], fingerAnim: 'sgn-wobV', fingerAt: { l: 85.7, t: 55.2 }, fingerMargin: '2px 0 0 -14px', next: 'end' },
      { id: 'end', type: 'end', aw: 1200, ah: 2000 },
    ];
  }

  cur() { return this.STEPS[this.state.idx]; }

  // ── Google Analytics (이 튜토리얼은 iframe이라 부모 페이지로 postMessage 중계) ──
  //   tutorial_start    : 타이틀에서 첫 화면으로 넘어갈 때 1회
  //   tutorial_step     : 각 화면에 처음 도달할 때 1회 (step_id · step_no)
  //   tutorial_complete : 종료 화면 도달 시 1회
  //   ※ 뒤로가기·같은 화면 재방문은 중복 집계하지 않음. 부모의 GA 블록이 받아서 gtag로 보냄.
  GA_NAME = 'class';
  gaSend(name, params) {
    try {
      params = params || {}; params.tutorial = this.GA_NAME;
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ __kumonGA: 1, name: name, params: params }, '*');
      } else if (window.gtag) { window.gtag('event', name, params); }
    } catch (e) {}
  }
  gaTrack(toId, isBack) {
    if (isBack || !toId) return;
    this._gaSeen = this._gaSeen || {};
    if (!this._gaStarted && toId !== 'title') { this._gaStarted = 1; this.gaSend('tutorial_start', {}); }
    if (toId === 'end') {
      if (!this._gaDone) { this._gaDone = 1; this.gaSend('tutorial_complete', {}); }
      return;
    }
    if (toId === 'title' || this._gaSeen[toId]) return;
    this._gaSeen[toId] = 1;
    const i = this.indexOf(toId), s = i >= 0 ? this.STEPS[i] : null;
    this.gaSend('tutorial_step', { step_id: toId, step_no: (s && s.dot) || 0 });
  }

  componentDidMount() {
    this.ensureInit();
  }

  ensureInit() {
    if (this._init) return;
    this._init = true;
    const seen = {};
    const need = [];
    this.STEPS.forEach((s) => {
      const list = [s.bg, s.pen ? 'Spen.png' : null, s.imgInset && s.imgInset.src];
      if (s.insets) s.insets.forEach((it) => list.push(it.src));
      list.forEach((f) => {
        if (f && !seen[f]) { seen[f] = 1; need.push(f); }
      });
    });
    ['char-full.png', 'char-head.png', 'cursor-hand.png'].forEach((f) => { if (!seen[f]) { seen[f] = 1; need.push(f); } });
    need.forEach((f) => {
      const im = new Image();
      const mark = () => this.setState((st) => ({ loaded: Object.assign({}, st.loaded, { [f]: true }) }));
      im.onload = im.onerror = mark;
      im.src = this.BASE + f;
    });
  }

  stepReady(c) {
    const L = this.state.loaded || {};
    if (c.type !== 'screen') return true;
    if (c.bg && !L[c.bg]) return false;
    if (c.pen && !L['Spen.png']) return false;
    if (c.imgInset && !L[c.imgInset.src]) return false;
    if (c.insets && c.insets.some((it) => !L[it.src])) return false;
    return true;
  }

  // Staged reveal (0.3s steps): bg -> inset -> box -> finger -> character -> bubble. Each fades in.
  startReveal(idx) {
    const c = this.STEPS[idx];
    if (!c || c.type !== 'screen') return;
    if (this._revealIdx === idx) return;
    this._revealIdx = idx;
    this.clearTimers();
    [1, 2, 3, 4, 5].forEach((p) => { this._timers.push(setTimeout(() => this.setState({ phase: p }), 300 * p)); });
  }

  clearTimers() { if (this._timers) this._timers.forEach(clearTimeout); this._timers = []; }

  armReveal(idx) {
    const c = this.STEPS[idx];
    if (!c || c.type !== 'screen') return;
    const bg = c.bg;
    const tryStart = () => {
      if (this.state.idx !== idx) return;
      if (!bg || (this.state.loaded && this.state.loaded[bg])) { this.startReveal(idx); }
      else { this._armT = setTimeout(tryStart, 80); }
    };
    tryStart();
  }

  resetReveal() { this.clearTimers(); clearTimeout(this._armT); this._revealIdx = null; }
  indexOf(id) { return this.STEPS.findIndex(s => s.id === id); }

  pathIds() {
    return ['title', 's1', 's2', 's3', 's3b', 's4', 's5', 's6', 's7', 's8', 's9', 'end'];
  }
  pathIdxList() { return this.pathIds().map((id) => this.indexOf(id)); }

  navigate(toId, isBack) {
    if (this.state.busy || !toId) return;
    const ti = this.indexOf(toId);
    if (ti < 0) return;
    this.gaTrack(toId, isBack);
    this.resetReveal();
    // 검은 페이드 화면전환 (현재 스텝에 fadeNext: true, 앞으로 갈 때만)
    if (!isBack && this.cur().fadeNext) {
      this.setState({ busy: true, fadeBlack: true });
      setTimeout(() => {
        this.setState((s) => {
          const hist = s.history.slice(); hist.push(s.idx);
          return { idx: ti, history: hist, out: false, recordOn: false, phase: 0, bgOut: false, prevBg: null, prevShown: false };
        });
        this.armReveal(ti);
        setTimeout(() => this.setState({ fadeBlack: false }), 200);
        setTimeout(() => this.setState({ busy: false }), 450);
      }, 430);
      return;
    }
    const curBg = this.cur().bg, nextBg = this.STEPS[ti].bg;
    const sameBg = !!(curBg && nextBg && curBg === nextBg);
    const soft = !!(this.STEPS[ti].softFrom && curBg && nextBg && curBg !== nextBg);
    if (soft) this.setState({ busy: true, out: true, bgOut: false, prevBg: curBg, prevShown: true });
    else this.setState({ busy: true, out: true, bgOut: !sameBg, prevBg: null, prevShown: false });
    setTimeout(() => {
      this.setState((s) => {
        const hist = s.history.slice();
        if (isBack) hist.pop(); else hist.push(s.idx);
        return { idx: ti, history: hist, out: false, recordOn: false, phase: 0, bgOut: false };
      });
      if (soft) { setTimeout(() => this.setState({ prevShown: false }), 30); setTimeout(() => this.setState({ prevBg: null }), 420); }
      this.armReveal(ti);
      setTimeout(() => this.setState({ busy: false }), 200);
    }, 200);
  }

  tap = (e) => {
    if (this.state.busy) return;
    const c = this.cur();
    if (c.type !== 'screen' && c.type !== 'title') return;
    if (c.type === 'screen' && this.state.phase < 5) return;
    if (c.record && !this.state.recordOn) {
      this.setState({ recordOn: true, pressing: true });
      setTimeout(() => { this.setState({ pressing: false }); this.navigate(c.next, false); }, 480);
      return;
    }
    if (!c.next) return;
    this.setState({ pressing: true });
    setTimeout(() => { this.setState({ pressing: false }); this.navigate(c.next, false); }, 150);
  };

  back = (e) => {
    if (e && e.stopPropagation) e.stopPropagation();
    if (this.state.busy) return;
    const h = this.state.history;
    if (!h.length) return;
    this.navigate(this.STEPS[h[h.length - 1]].id, true);
  };

  choosePen = (pen) => {
    if (this.state.busy) return;
    this.setState({ pen, pressPen: pen });
    setTimeout(() => {
      this.setState({ pressPen: null });
      this.navigate(pen === 'android' ? 'step6' : 'step7', false);
    }, 150);
  };
  onAndroid = (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.choosePen('android'); };
  onApple = (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.choosePen('ios'); };

  dotToIdx(dot) { const id = this.pathIds()[dot]; const i = this.indexOf(id); return i < 0 ? this.state.idx : i; }
  buildHistory(targetIdx) { const list = this.pathIdxList(); const p = list.indexOf(targetIdx); return p <= 0 ? [] : list.slice(0, p); }
  jump(targetIdx) {
    if (this.state.busy || targetIdx === this.state.idx) return;
    this.gaTrack(this.STEPS[targetIdx] && this.STEPS[targetIdx].id, false);
    this.resetReveal();
    const curBg = this.cur().bg, nextBg = this.STEPS[targetIdx].bg;
    const sameBg = !!(curBg && nextBg && curBg === nextBg);
    const soft = !!(this.STEPS[targetIdx].softFrom && curBg && nextBg && curBg !== nextBg);
    if (soft) this.setState({ busy: true, out: true, bgOut: false, prevBg: curBg, prevShown: true });
    else this.setState({ busy: true, out: true, bgOut: !sameBg, prevBg: null, prevShown: false });
    setTimeout(() => {
      this.setState({ idx: targetIdx, history: this.buildHistory(targetIdx), out: false, recordOn: false, phase: 0, bgOut: false });
      if (soft) { setTimeout(() => this.setState({ prevShown: false }), 30); setTimeout(() => this.setState({ prevBg: null }), 420); }
      this.armReveal(targetIdx);
      setTimeout(() => this.setState({ busy: false }), 200);
    }, 200);
  }
  onDot = (dot, e) => { if (e && e.stopPropagation) e.stopPropagation(); if (this.state.busy) return; this.jump(this.dotToIdx(dot)); };

  onRestart = (e) => {
    if (e && e.stopPropagation) e.stopPropagation();
    if (this.state.busy) return;
    this.resetReveal();
    // fade to black, reset while covered, then fade black back out to reveal the title
    this.setState({ busy: true, fadeBlack: true });
    setTimeout(() => {
      this.setState({ idx: 0, history: [], pen: null, recordOn: false, out: false, closed: false, phase: 0, prevBg: null, prevShown: false, bgOut: false });
      setTimeout(() => this.setState({ fadeBlack: false }), 180);
      setTimeout(() => this.setState({ busy: false }), 620);
    }, 430);
  };
  onClose = (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ closed: true }); };
  onReopen = (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.onRestart(e); };

  // bubble markup: [r]..[/r] red+bold, [b]..[/b] blue+bold, [g]..[/g] gray (smaller, not bold)
  parseBubble(str) {
    const runs = [];
    if (!str) return runs;
    const re = /\[(r|b|g)\]([\s\S]*?)\[\/\1\]/g;
    let last = 0, m;
    while ((m = re.exec(str))) {
      if (m.index > last) runs.push({ t: str.slice(last, m.index), k: '' });
      runs.push({ t: m[2], k: m[1] });
      last = re.lastIndex;
    }
    if (last < str.length) runs.push({ t: str.slice(last), k: '' });
    return runs;
  }
  bubbleRunStyle(k) {
    if (k === 'r') return 'color:#E00020; font-weight:700;';
    if (k === 'b') return 'color:#1D1DFF; font-weight:700;';
    if (k === 'g') return 'color:#8a8f98; font-size:.86em;';
    return '';
  }

  renderVals() {
    this.ensureInit();
    const c = this.cur();
    const s = this.state;
    const F = 1615 / 2600;
    // Every screen fills the whole tablet frame (no letterbox/pillarbox) so the
    // rendered content size stays identical from step to step — no size jumps.
    const mL = 0, mT = 0, mW = 100, mH = 100;
    const path = this.pathIds();
    const total = path.length - 2;
    const curDot = (c.type === 'end') ? 0 : path.indexOf(c.id);
    const dots = [];
    for (let i = 1; i <= total; i++) {
      const on = i <= curDot;
      const clickable = i !== curDot;
      dots.push({
        style: `background:${on ? '#ffd34d' : 'rgba(255,255,255,.28)'}; cursor:${clickable ? 'pointer' : 'default'}`,
        onClick: clickable ? (e) => this.onDot(i, e) : (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
      });
    }

    const p = this.state.phase;
    const mountReveal = c.type === 'screen' && p >= 1;
    const showChar = mountReveal;
    const showPen = mountReveal;
    // inset images (STEP 8d popovers, STEP 17 dialog): mount on reveal, each fades
    // in (sgn-fadein) with a staggered delay so multiple images appear in sequence.
    const insetsR = mountReveal
      ? (c.insets || []).map((it, i) => ({
          style: `position:absolute; left:${it.l}%; top:${it.t}%; width:${it.w}%; height:${it.h}%; background-image:url("${this.BASE}${it.src}"); background-position:center; background-repeat:no-repeat; image-rendering:pixelated; `
            + (it.framed
                ? `background-size:cover; background-color:#fff; border:4px solid #3a2e5c; box-shadow:5px 5px 0 rgba(58,46,92,.3);`
                : `background-size:contain; filter:drop-shadow(3px 5px 5px rgba(58,46,92,.4));`)
            + ` animation:sgn-fadein .5s ease both; animation-delay:${(i * 0.4).toFixed(2)}s;`
        }))
      : [];
    const pressTf = `transform:scale(${s.pressing ? 0.86 : 1}); transform-origin:center center; transition:transform .13s ease, opacity .3s ease;`;
    const boxes = c.boxes || [];
    const boxesR = mountReveal ? boxes.map((b) => ({ style: `left:${b.l}%;top:${b.t}%;width:${b.w}%;height:${b.h}%;border-radius:${b.r || '0'};opacity:${p >= 2 ? 1 : 0};${pressTf}` })) : [];
    const anim = c.fingerAnim || 'sgn-wob';
    const fMargin = c.fingerMargin || '-15px 0 0 -4px';
    const fOpac = p >= 3 ? 1 : 0;
    const fWrap = `${pressTf}`;
    const fInner = `width:48px; aspect-ratio:765/536; margin:${fMargin}; opacity:${fOpac}; transition:opacity .3s ease; background-image:url("${this.BASE}cursor-hand.png"); background-size:contain; background-repeat:no-repeat; background-position:left center; image-rendering:pixelated; filter:drop-shadow(2px 3px 0 rgba(58,46,92,.28)); animation:${anim} .8s ease-in-out infinite;`;
    const fingers = (mountReveal && !c.noFinger)
      ? (c.fingerAt
          ? [{ wrapStyle: `left:${c.fingerAt.l}%; top:${c.fingerAt.t}%; ${fWrap}`, innerStyle: fInner }]
          : boxes.map((b) => ({ wrapStyle: `left:${b.l + b.w / 2}%; top:${b.t + b.h / 2}%; ${fWrap}`, innerStyle: fInner })))
      : [];

    const bottomBubble = c.pos === 'bottom';
    const bubbleRuns = this.parseBubble(c.bubble || '').map((run) => ({ text: run.t, style: this.bubbleRunStyle(run.k) }));

    return {
      isTitle: c.type === 'title',
      showChar,
      insetsR,
      isPen: c.type === 'penchoice',
      isEnd: c.type === 'end',
      closed: s.closed,
      notClosed: !s.closed,
      bubbleRuns,
      boxesR,
      fingers,
      hasRecord: c.type === 'screen' && !!c.record && p >= 2,
      recordDotStyle: c.record ? `left:${c.record.cx}%; top:${c.record.cy}%; transform:translate(-50%,-50%); width:${c.record.d}%; aspect-ratio:1; background:${s.recordOn ? '#e53935' : '#ffffff'}; box-shadow:0 0 0 1px rgba(0,0,0,.15);` : 'display:none',
      hasPen: c.type === 'screen' && !!c.pen && showPen,
      penStyle: c.pen ? `left:${c.pen.l}%; top:${c.pen.t}%; width:${c.pen.w}%; aspect-ratio:1536/1024; background-image:url("${this.BASE}Spen.png"); background-size:contain; background-repeat:no-repeat; background-position:center; animation:sgn-fadein .8s ease both;` : 'display:none',
      bubbleWrapStyle: (bottomBubble ? 'bottom:9%;' : 'top:3%;') + ' left:4%; right:4%;',
      charHeadStyle: `background-image:url("${this.BASE}char-head.png"); opacity:${p >= 4 ? 1 : 0}; transition:opacity .3s ease`,
      bubbleBoxStyle: `position:relative; flex:1; opacity:${p >= 5 ? 1 : 0}; transition:opacity .3s ease`,
      charFullStyle: `background-image:url("${this.BASE}char-full.png")`,
      penAStyle: `transform:scale(${s.pressPen === 'android' ? 0.96 : 1}); transition:transform .12s ease;`,
      penIStyle: `transform:scale(${s.pressPen === 'ios' ? 0.96 : 1}); transition:transform .12s ease;`,
      showBack: !s.closed && s.history.length > 0 && c.type !== 'end',
      fadeBlackStyle: `position:absolute; inset:0; z-index:40; background:#000; opacity:${s.fadeBlack ? 1 : 0}; transition:opacity .4s ease; pointer-events:${s.fadeBlack ? 'auto' : 'none'};`,
      showProgress: !s.closed && curDot > 0,
      dots,
      wrapStyle: `width:100%; max-width:100%;`,
      stageStyle: `position:relative; width:100%; aspect-ratio:1200/2000; overflow:hidden; background:#0d0f1a; cursor:${c.type === 'screen' ? 'none' : 'default'}; user-select:none; container-type:inline-size;`,
      innerStyle: `position:absolute; left:${mL.toFixed(2)}%; top:${mT.toFixed(2)}%; width:${mW.toFixed(2)}%; height:${mH.toFixed(2)}%;`,
      bgLayerStyle: `position:absolute; inset:0; ${(c.type === 'screen' && c.bg) ? `background-image:url("${this.BASE}${c.bg}"); background-size:100% 100%; background-repeat:no-repeat; image-rendering:pixelated;` : ''} opacity:${(c.type === 'screen' && c.bg && s.loaded && s.loaded[c.bg] && !s.bgOut) ? 1 : 0}; transition:opacity .32s ease; pointer-events:none;`,
      prevBgStyle: `position:absolute; inset:0; ${s.prevBg ? `background-image:url("${this.BASE}${s.prevBg}"); background-size:100% 100%; background-repeat:no-repeat; image-rendering:pixelated;` : 'display:none;'} opacity:${s.prevShown ? 1 : 0}; transition:opacity .32s ease; pointer-events:none;`,
      fxStyle: `position:absolute; inset:0; opacity:${s.out ? 0 : 1}; transition:opacity .32s ease;`,
      charLayerStyle: `position:absolute; left:${mL.toFixed(2)}%; top:${mT.toFixed(2)}%; width:${mW.toFixed(2)}%; height:${mH.toFixed(2)}%; opacity:${s.out ? 0 : 1}; transition:opacity .3s ease; pointer-events:none;`,
      onTap: this.tap, onBack: this.back,
      onAndroid: this.onAndroid, onApple: this.onApple,
      onRestart: this.onRestart, onClose: this.onClose, onReopen: this.onReopen,
    };
  }
}
</script>
</body>
</html>
